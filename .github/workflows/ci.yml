name: CI — MECHA IA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

# Le projet vit dans le sous-dossier mecha-ia/ : toutes les commandes `run`
# s'y exécutent par défaut.
defaults:
  run:
    working-directory: mecha-ia

jobs:
  # ============================================================
  # 1. Tests — s'exécute sur push et pull request
  # ============================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install ruff pytest pandas numpy scikit-learn xgboost httpx
          pip install -r src/api/requirements.txt

      - name: Lint (ruff)
        run: ruff check src/ scripts/ --ignore E501

      - name: Tests unitaires
        run: pytest tests/ -v --tb=short

      - name: Valider docker-compose.yml
        run: docker compose config --quiet

  # ============================================================
  # 2. Build des images — sur push et pull request
  #    Publication sur ghcr.io uniquement sur push vers main
  # ============================================================
  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
            image: mecha-ia-api
          - name: pipeline
            dockerfile: Dockerfile.pipeline
            image: mecha-ia-pipeline
    steps:
      - uses: actions/checkout@v4

      # Docker exige des noms d'image en minuscules (le propriétaire du repo
      # contient des majuscules).
      - name: Nom de l'image
        id: img
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: mecha-ia
          file: mecha-ia/${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

apiVersion: 1
datasources:
  - name: MECHA-Postgres
    # uid fixe : les dashboards provisionnés y font référence explicitement.
    # Sans lui, Grafana en génère un aléatoire et les dashboards ne trouvent plus leur source.
    uid: mecha_postgres
    type: postgres
    url: postgres:5432
    database: mecha
    user: grafana_ro
    secureJsonData:
      password: grafana_mecha_2026
    jsonData:
      database: mecha
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
    editable: false

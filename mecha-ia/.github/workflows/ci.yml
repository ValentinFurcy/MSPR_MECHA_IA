name: CI/CD — MECHA IA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # 1. Tests — s'exécute sur push et pull request
  # ============================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install ruff pytest pandas numpy scikit-learn xgboost httpx
          pip install -r src/api/requirements.txt

      - name: Lint (ruff)
        run: ruff check src/ scripts/ --ignore E501

      - name: Tests unitaires
        run: pytest tests/ -v --tb=short

      - name: Valider docker-compose.yml
        run: docker compose config --quiet

  # ============================================================
  # 2. Build & push des images — seulement sur push vers main
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
            image: mecha-ia-api
          - name: pipeline
            dockerfile: Dockerfile.pipeline
            image: mecha-ia-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max